{% extends "base.html" %}{% block content %}
<div class="page-title"><div><h1>Edit Inventory Item</h1><p>Change the item details without losing its history.</p></div><a class="btn btn2" href="{{url_for('items')}}">← Inventory</a></div>
<form method="post" class="card"><div class="row"><label>Category<select name="category_id" required>{% for cat in categories %}<option value="{{cat.id}}" {% if item.category_id==cat.id %}selected{% endif %}>{{cat.name}}</option>{% endfor %}</select></label><label>Part Number<input name="code" value="{{item.code or ''}}"></label><label>Description *<input name="description" value="{{item.description}}" required></label><label>Unit<input name="unit" value="{{item.unit or 'each'}}"></label><label>Qty<input name="qty" type="number" step="0.01" min="0" value="{{item.qty or 0}}"></label><label>Price (ZAR)<input name="price" type="number" step="0.01" min="0" value="{{item.price or 0}}"></label></div><button class="success">Save Changes</button> <a class="btn btn2" href="{{url_for('items')}}">Cancel</a></form><style>.success{background:#16885b;color:#fff}</style>
{% endblock %}
