{% extends "base.html" %}{% block content %}
<div class="page-title"><div><h1>Edit Inventory Item</h1><p>Part number and stock can be changed. Description, unit and price are fixed.</p></div><a class="btn btn2" href="{{url_for('items')}}">← Inventory</a></div>
<form method="post" class="card">
<div class="row">
<label>Category<select name="category_id" required>{% for cat in categories %}<option value="{{cat.id}}" {% if item.category_id==cat.id %}selected{% endif %}>{{cat.name}}</option>{% endfor %}</select></label>
<label>Part Number<input name="code" value="{{item.code or ''}}"></label>
<label>Description *<input value="{{item.description}}" readonly></label>
<label>Unit<input value="{{item.unit or 'each'}}" readonly></label>
<label>Stock Quantity<input name="qty" type="number" step="0.01" min="0" value="{{item.qty or 0}}"></label>
<label>Price per 1 Unit (ZAR)<input value="{{'%.2f'|format(item.price or 0)}}" readonly></label>
</div>
<button class="success">Save Changes</button> <a class="btn btn2" href="{{url_for('items')}}">Cancel</a>
</form>
<style>.success{background:#16885b;color:#fff}.card input[readonly]{background:#f1f3f5;color:#687580;cursor:not-allowed}</style>
{% endblock %}
