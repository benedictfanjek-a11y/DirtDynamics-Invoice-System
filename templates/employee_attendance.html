<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Attendance — Dirt Dynamics</title><style>body{font-family:Arial;background:#f4f6f8;color:#122131;margin:0}.top{background:#07131c;color:#fff;padding:14px;text-align:center;border-bottom:4px solid #f5a20a}.top img{width:95px;height:70px;object-fit:contain;background:#000}.wrap{width:min(700px,94%);margin:20px auto}.card{background:#fff;border:1px solid #dce3e8;border-radius:12px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:25px;font-weight:900}.green{color:#16885b}.red{color:#b53b32}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5eaee;text-align:left}th{font-size:11px;text-transform:uppercase;background:#f6f8fa}.btn{display:inline-block;padding:11px 14px;background:#e9eef2;color:#122131;text-decoration:none;border-radius:8px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><img src="/static/dirt-dynamics-logo.jpg"><div>MY ATTENDANCE</div></div><div class="wrap"><div class="card"><form method="get"><label><strong>Select Month</strong><input type="month" name="month" value="{{month}}" onchange="this.form.submit()" style="padding:11px;margin-top:6px;width:100%;box-sizing:border-box"></label></form></div><div class="card"><h2>{{employee.full_name}}</h2><div class="grid"><div><small>DAYS WORKED</small><div class="stat green">{{worked}}</div></div><div><small>DAY RATE</small><div class="stat">R {{'%.2f'|format(day_rate)}}</div></div></div></div><div class="card"><table><thead><tr><th>Date</th><th>Day</th><th>Status</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.work_date}}</td><td>{{r.work_date|datetime_day}}</td><td class="{% if r.final_worked %}green{% else %}red{% endif %}"><strong>{% if r.final_worked %}WORKED{% else %}NOT WORKED{% endif %}</strong></td></tr>{% endfor %}</tbody></table><p><a class="btn" href="{{url_for('employee_portal')}}">← BACK</a></p></div></div></body></html>
