<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Registration — Dirt Dynamics</title><style>body{font-family:Arial;background:#07131c;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center}.box{background:#fff;color:#122131;width:min(430px,92%);padding:30px;border-radius:14px}.logo{display:block;width:180px;height:130px;object-fit:contain;background:#000;margin:0 auto 15px}.gold{color:#f5a20a;font-weight:900;text-align:center}.box h1{text-align:center;margin:6px 0 22px}.box label{display:block;font-weight:700;font-size:13px;margin:14px 0}.box input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd6de;border-radius:8px;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:8px;background:#f5a20a;font-weight:900;font-size:15px;margin-top:8px}.msg{background:#e2f7ec;color:#174b36;padding:10px;border-radius:7px;margin-bottom:10px}.small{text-align:center;color:#718092;font-size:12px;margin-top:18px}</style></head><body><div class="box"><img class="logo" src="/static/dirt-dynamics-logo.jpg"><div class="gold">DIRT DYNAMICS (PTY) LTD</div><h1>Employee Registration</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="msg">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>Employee Number<input name="employee_number" required></label><label>Email Address<input name="email" type="email" required></label><label>Create Password<input name="password" type="password" minlength="6" required></label><label>Confirm Password<input name="confirm_password" type="password" minlength="6" required></label><button class="btn" type="submit">CREATE MY ACCOUNT</button></form><div class="small">Already registered? Return to the Dirt Dynamics login page.</div></div></body></html>
