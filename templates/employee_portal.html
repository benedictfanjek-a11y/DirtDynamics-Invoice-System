<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131c"><title>Employee Portal — Dirt Dynamics</title><style>body{font-family:Arial;background:#f4f6f8;color:#122131;margin:0}.top{background:#07131c;color:#fff;padding:16px;text-align:center;border-bottom:4px solid #f5a20a}.top img{width:110px;height:80px;object-fit:contain;background:#000;border-radius:5px}.wrap{width:min(650px,92%);margin:25px auto}.card{background:#fff;border:1px solid #dce3e8;border-radius:14px;padding:24px;margin-bottom:16px}.big{width:100%;min-height:72px;padding:20px;border:0;border-radius:12px;background:#16885b;color:#fff;font-size:23px;font-weight:900}.done{background:#e2f7ec;color:#17613f;padding:20px;border-radius:10px;text-align:center;font-weight:800;font-size:18px}.stat{text-align:center;font-size:38px;font-weight:900;color:#f5a20a}.btn{display:block;text-align:center;text-decoration:none;padding:15px;background:#e9eef2;color:#122131;border-radius:9px;font-weight:800;margin-top:12px}.muted{text-align:center;color:#718092;font-size:13px}.logout{background:#07131c;color:#fff}</style></head><body><div class="top"><img src="/static/dirt-dynamics-logo.jpg" alt="Dirt Dynamics logo"><div><strong>DIRT DYNAMICS</strong><br><small>EMPLOYEE PORTAL</small></div></div><div class="wrap"><div class="card"><h2>Welcome, {{employee.full_name}}</h2><p>Today: <strong>{{today}}</strong></p>{% if today_record.final_worked %}<div class="done">✓ TODAY IS RECORDED AS WORKED</div>{% else %}<form method="post" action="{{url_for('employee_mark_today')}}"><button class="big" type="submit">I WORKED TODAY</button></form><p class="muted" style="margin-top:12px">Press once after you have worked today.</p>{% endif %}</div><div class="card"><div class="muted">DAYS WORKED THIS MONTH</div><div class="stat">{{days_worked}}</div><a class="btn" href="{{url_for('employee_attendance')}}">VIEW MY MONTH</a><a class="btn logout" href="{{url_for('logout')}}">LOG OUT</a></div></div></body></html>
